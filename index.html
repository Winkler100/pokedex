<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" href="./favicons/favicon.png">
    <link rel="stylesheet" href="style.css">
    <script defer src="./js/script.js"></script>
</head>
<body>

    <main>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/132.gif"
        alt="pokemon" class="pokemon_image">
        <img src="./imagens/florestpokedex.png" alt="pokedex" class="pokedex">

        <h1 class="pokemon_data">
            <span class="pokemon_number"></span> -
            <span class="pokemon_name"></span>

        </h1>

        <form class="form">
                <input 
                    type="search"
                    class="input_search"
                    placeholder="name ou number"
                    required
                    />
            </form>

        <div class="buttons">
            <button class="button btn-prev">Prev &lt;</button>
            <button class="button btn-next">Next &gt;</button>
        </div>
    </main>
    <h2 class="title"> Bem vindo a pokedex de: <a href="https://github.com/Winkler100"> Artur Winkler</a></h2>
</body>
</html>
